# docker compose -f docker/compose.yaml run --rm so101            ← 컨테이너 안 bash
# docker compose -f docker/compose.yaml run --rm so101 ros2 launch so101_ros sort.launch.py
services:
  so101:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: so101-lab:humble
    entrypoint: ["bash", "/root/so101-lab/docker/entrypoint.sh"]   # 레포의 것을 직접 (고쳐도 다시 빌드할 필요 없음)
    command: ["bash"]          # entrypoint 를 바꾸면 이미지의 기본 명령이 지워지므로 다시 적는다
    network_mode: host          # PC 의 RViz · 다른 노드와 같은 네트워크 (ROS_DOMAIN_ID 만 맞추면 보인다)
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - HOST_USER=${USER:-user}           # 컨테이너 안 사용자 이름 = Pi 사용자 (번호는 레포 폴더 주인과 같게)
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4   # 공유 메모리 대신 UDP: 같은 Pi 의 다른 사용자(HiWonder 차의 ubuntu) 노드와도 통한다
    privileged: true            # 팔 · 카메라는 /dev 통째로 (이름을 적으면 팔을 안 꽂은 Pi 에서 안 뜬다)
    volumes:
      - ..:/root/so101-lab      # 레포 그대로 (자세 · 카메라 설정이 Pi 에 남는다)
      - /dev:/dev
    stop_signal: SIGINT         # docker stop 도 Ctrl+C 처럼 (SIGTERM 이면 10초 기다렸다 강제로 끈다)
    stdin_open: true
    tty: true
